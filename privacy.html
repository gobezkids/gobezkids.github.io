/* shared game pieces: level list, progress dots, answer buttons */
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}

.choice:active{transform:translateY(3px);box-shadow:0 2px 0 var(--sun2)}
.choice.used{visibility:hidden}.choice.no{opacity:.4}.choice.ok{background:var(--leaf);box-shadow:0 5px 0 var(--leaf2);color:#fff}
@media (max-width:420px){.choice{min-width:70px;min-height:70px;font-size:1.9rem}}

<div class="panel stack"><h1 data-t="h"></h1><p data-t="p1"></p><p data-t="p2"></p><p data-t="p3"></p><p data-t="p4"></p><div><button class="btn sky" type="button" id="cnt"></button></div><p data-t="p5"></p></div></main><div class="tibeb" aria-hidden="true"></div><script>/* Gobez Kids — shared helpers: language, storage, stars, celebration, practice coach, anonymous counting. */

const COMMON_T={
 en:{lang:"አማርኛ",home:"Home",playAgain:"Play again",next:"Next",skip:"Skip practice",practice:"Practice round",gotIt:"Let's play!",

 am:{lang:"English",home:"መነሻ",playAgain:"እንደገና ተጫወቱ",next:"ቀጥል",skip:"ልምምዱን ዝለሉ",practice:"የልምምድ ዙር",gotIt:"እንጫወት!",
  voice:"ድምፅ በቅርቡ",starEarned:"ኮከብ አገኛችሁ!",yay:["ጎበዝ!","በጣም ጥሩ!","አደረጋችሁት!","ጎበዝ ልጆች!","ዋው!"],tryAgain:"እንደገና ሞክሩ፤ ትችላላችሁ!",
  coachTitle:"የልምምድ ዙር",soon:"በቅርቡ",grade:"ክፍል",nextQ:"ቀጣይ →"}};
let LANG=LS.get("lang",null)||((navigator.language||"").toLowerCase().indexOf("am")===0?"am":"en");
let PAGE_T={en:{},am:{}};
const t=k=>{const d=PAGE_T[LANG][k]!==undefined?PAGE_T[LANG][k]:COMMON_T[LANG][k];return d===undefined?k:d};
const yay=()=>{const a=t("yay");return a[Math.floor(Math.random()*a.length)]};
const onLang=[];
function applyLang(){document.documentElement.lang=LANG;document.querySelectorAll("[data-t]").forEach(e=>{const v=t(e.dataset.t);if(typeof v==="string")e.textContent=v});
 document.querySelectorAll("[data-tt]").forEach(e=>e.setAttribute("aria-label",t(e.dataset.tt)));if(PAGE_T[LANG].pageTitle)document.title=PAGE_T[LANG].pageTitle;onLang.forEach(f=>f())}
function setLang(l){LANG=l;LS.set("lang",l);applyLang()}

/* stars: one per finished board or round, kept per game and level */
const stars={get(g,l){const s=LS.get("stars",{});return l==null?Object.keys(s).filter(k=>k.split(".")[0]===g).reduce((a,k)=>a+s[k],0):(s[g+"."+l]||0)},
 add(g,l){const s=LS.get("stars",{});s[g+"."+l]=(s[g+"."+l]||0)+1;LS.set("stars",s)},

/* celebration with a star */
function party(title,sub,buttons){const old=$("party");if(old)old.remove();const p=document.createElement("div");p.className="party";p.id="party";p.setAttribute("role","dialog");p.setAttribute("aria-modal","true");

 buttons.forEach(([label,cls,fn])=>{const b=document.createElement("button");b.type="button";b.className="btn "+cls;b.textContent=label;b.onclick=()=>{p.remove();fn()};row.appendChild(b)});
 document.body.appendChild(p);row.firstChild&&row.firstChild.focus();confetti()}
function confetti(){if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;const cols=["#FFD54A","#5DBB63","#6EC6F0","#E0533D","#F5B700"];
 for(let i=0;i<40;i++){const c=document.createElement("div");c.className="confetti";c.style.left=Math.random()*100+"vw";c.style.background=cols[i%cols.length];c.style.animationDuration=(1.6+Math.random()*1.6)+"s";c.style.animationDelay=(Math.random()*.4)+"s";document.body.appendChild(c);setTimeout(()=>c.remove(),3600)}}

const coach={el:null,

   (opts.parent||document.querySelector(".wrap")).appendChild(c);this.el=c}
  c.querySelector("b").textContent=t("coachTitle");const sk=c.querySelector(".skip");sk.textContent=t("skip");sk.hidden=!opts.onSkip;sk.onclick=()=>opts.onSkip&&opts.onSkip();
  c.querySelector("p").textContent=text;const row=c.querySelector(".btns");row.innerHTML="";
  (opts.buttons||[]).forEach(([label,cls,fn])=>{const b=document.createElement("button");b.type="button";b.className="btn "+cls;b.textContent=label;b.onclick=fn;row.appendChild(b)});row.hidden=!(opts.buttons||[]).length},

function showNext(cb){let w=$("nextWrap");if(!w){w=document.createElement("div");w.id="nextWrap";w.className="nextwrap";const m=$("msg");m.parentNode.insertBefore(w,m.nextSibling)}
 w.innerHTML="";const b=document.createElement("button");b.type="button";b.className="btn go nextbtn";b.id="nextBtn";b.textContent=t("nextQ");b.onclick=()=>{w.innerHTML="";cb()};w.appendChild(b);

/* Shared round flow for the level-based games: level list, 5 questions per round, star, practice round. */
function makeGame(o){/* o: {key, nQ, renderQ(), onLang()} */
 const G={lvl:LS.get(o.key+".lvl",0),qi:0,tut:null,timers:[]};
 G.later=(ms,f)=>G.timers.push(setTimeout(f,ms));
 G.say=(s,cls)=>{const m=$("msg");m.textContent=s||"";m.className="msg "+(cls||"")};

 G.renderSetup=()=>{$("starCount").innerHTML="⭐ "+stars.get(o.key);const box=$("levels");box.innerHTML="";const L=t("levels");if(G.lvl>=L.length)G.lvl=0;
  L.forEach((l,i)=>{const b=document.createElement("button");b.type="button";b.setAttribute("aria-pressed",String(i===G.lvl));b.innerHTML="<b></b><span></span>";

 G.show=v=>{clearNext();G.timers.forEach(clearTimeout);G.timers=[];$("v-setup").hidden=v!=="setup";$("v-play").hidden=v!=="play";if(v==="setup"){coach.hide();G.tut=null;G.renderSetup()}window.scrollTo(0,0)};

  party(t("roundDone"),t("starEarned"),[[t("playAgain"),"go",G.start],[t("newLvl"),"ghost",()=>G.show("setup")]])};
 G.start=()=>{coach.hide();G.tut=null;G.qi=0;G.show("play");G.prog();o.renderQ();track("game-start",{game:o.key,level:G.lvl+1})};

 $("startBtn").onclick=()=>{if(!LS.get(o.key+"Tut",false))G.startTut();else G.start()};
